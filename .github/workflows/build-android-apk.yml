name: Build Studio Black7 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-apk/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: "studio-black7-apk"
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare app icon
        run: |
          mkdir -p android-apk/app/src/main/res/drawable
          cp public/icon-512.png android-apk/app/src/main/res/drawable/app_icon.png

      - name: Build installable APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish APK into the website
        run: |
          mkdir -p public/downloads
          cp android-apk/app/build/outputs/apk/debug/app-debug.apk public/downloads/StudioBlack7.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/StudioBlack7.apk
          if git diff --cached --quiet; then
            echo "APK unchanged."
          else
            git commit -m "Publish Studio Black7 Android APK"
            git push
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioBlack7-APK
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
