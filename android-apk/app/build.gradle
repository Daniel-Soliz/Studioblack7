plugins {
    id 'com.android.application'
}

android {
    namespace 'com.studioblack7.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.studioblack7.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
